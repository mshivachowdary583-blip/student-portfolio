<!DOCTYPE html>
<html>
<head>
    <title>Student Portfolio</title>
    <style>
        body {
            font-family: Arial;
            background: lightgray;
        }

        header, footer {
            background: navy;
            color: white;
            text-align: center;
            padding: 10px;
        }

        nav {
            display: flex;
            justify-content: space-around;
            background: black;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            padding: 10px;
        }

        section {
            background: white;
            margin: 10px;
            padding: 10px;
        }

        @media(max-width: 600px) {
            nav {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>My Portfolio</h1>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#education">Education</a>
    <a href="#contact">Contact</a>
</nav>

<main>
    <section id="home">
        <h2>Home</h2>
        <p>Welcome to my portfolio.</p>
    </section>

    <section id="about">
        <h2>About Me</h2>
        <p>I am a student.</p>
    </section>

    <section id="skills">
        <h2>Skills</h2>
        <p>HTML, CSS, Python, C</p>
    </section>

    <section id="projects">
        <h2>Projects</h2>
        <p>Student Portfolio Website</p>
    </section>

    <section id="education">
        <h2>Education</h2>
        <p>B.Tech Student</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: student@gmail.com</p>
    </section>
</main>

<footer>
    <p>My Portfolio 2026</p>
</footer>

</body>
</html>
